<div
  class="flex h-dvh flex-col bg-gray-100 text-gray-900 dark:bg-gray-950 dark:text-gray-100"
  [class.dark]="theme() === 'dark'"
>
  <header class="flex items-center justify-between border-b border-gray-200 bg-white px-6 py-4 dark:border-gray-800 dark:bg-gray-900">
    <div class="flex gap-2">
      <button
        type="button"
        (click)="toggleTheme()"
        class="rounded-lg border border-gray-300 bg-white px-3.5 py-2 text-sm text-gray-900 transition-colors hover:bg-gray-100 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-100 dark:hover:bg-gray-700"
      >
        Tema: {{ theme() === 'light' ? 'Claro' : 'Oscuro' }}
      </button>
      <button
        type="button"
        (click)="logout()"
        class="rounded-lg bg-blue-800 px-3.5 py-2 text-sm font-semibold text-white transition-colors hover:bg-blue-900"
      >
        Cerrar sesión
      </button>
    </div>
  </header>

  <main class="flex-1 p-6">
    <p class="m-0 text-4xl font-bold">Bienvenido, {{ displayName() }}.</p>
  </main>
</div>
