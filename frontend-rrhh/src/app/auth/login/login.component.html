<div
  class="relative flex h-dvh items-center justify-center bg-gray-100 px-4 dark:bg-gray-950"
  [class.dark]="theme() === 'dark'"
>
  <button
    type="button"
    (click)="toggleTheme()"
    class="absolute top-4 right-4 rounded-lg border border-gray-300 bg-white px-3.5 py-2 text-sm text-gray-900 transition-colors hover:bg-gray-100 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-100 dark:hover:bg-gray-700"
  >
    Tema: {{ theme() === 'light' ? 'Claro' : 'Oscuro' }}
  </button>

  <form
    class="flex w-full max-w-sm flex-col gap-4 rounded-2xl bg-white p-8 shadow-lg dark:bg-gray-900"
    (ngSubmit)="onSubmit()"
  >
    <h1 class="mb-1 text-2xl font-semibold text-gray-900 dark:text-gray-100">Iniciar sesión</h1>

    @if (submitted) {
      <p class="m-0 text-sm text-red-600">Usuario y contraseña son obligatorios.</p>
    }

    <label class="flex flex-col gap-1.5 text-sm font-medium text-gray-700 dark:text-gray-300">
      Usuario
      <input
        name="username"
        type="text"
        [(ngModel)]="username"
        autocomplete="username"
        placeholder="Ingrese su usuario"
        class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-base text-gray-900 focus:border-blue-700 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-gray-100"
      />
    </label>

    <label class="flex flex-col gap-1.5 text-sm font-medium text-gray-700 dark:text-gray-300">
      Contraseña
      <span class="relative block">
        <input
          name="password"
          [type]="showPassword() ? 'text' : 'password'"
          [(ngModel)]="password"
          autocomplete="current-password"
          placeholder="....."
          class="w-full rounded-lg border border-gray-300 px-3 py-2.5 pr-11 text-base text-gray-900 focus:border-blue-700 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-gray-100"
        />
        <button
          type="button"
          (click)="togglePasswordVisibility()"
          aria-label="Mostrar u ocultar contraseña"
          class="absolute top-1/2 right-2 flex -translate-y-1/2 items-center justify-center rounded-md p-1.5 text-gray-500 hover:text-gray-700 focus:outline-none dark:text-gray-400 dark:hover:text-gray-200"
        >
          @if (showPassword()) {
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          }
        </button>
      </span>
    </label>

    <button
      type="submit"
      class="mt-2 rounded-lg bg-blue-800 px-4 py-3 text-base font-semibold text-white transition-colors hover:bg-blue-900"
    >
      Ingresar
    </button>
  </form>
</div>
